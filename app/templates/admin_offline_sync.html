<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Sync Admin</title><link rel="stylesheet" href="/static/store.css"><style>main{max-width:1100px;margin:25px auto;padding:15px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:16px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}button{padding:8px}</style></head><body><main><h1>Offline Sync & Conflict Review</h1><p id="summary">Loading...</p><div class="card"><table><thead><tr><th>Created</th><th>Device / action</th><th>Reason</th><th>Status</th><th>Review</th></tr></thead><tbody id="rows"></tbody></table></div><p><a href="/admin/system-check">Admin System Check</a> · <a href="/offline">Offline Center</a></p></main><script src="/static/offline-mode.js"></script><script>async function load(){const r=await fetch('/api/offline/admin-summary'),d=await r.json();summary.textContent=d.pending_conflicts+' pending conflict(s) · '+d.synced_transactions+' offline transaction(s) synced';rows.innerHTML=d.conflicts.map(c=>`<tr><td>${c.created_at}</td><td>${c.device_id}<br>${c.action_type}</td><td>${c.reason}</td><td>${c.status}</td><td>${c.status==='pending'?`<button onclick="review(${c.conflict_id})">Mark reviewed</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">No conflicts.</td></tr>';}async function review(id){const notes=prompt('Review notes (optional):')||'';await fetch('/api/offline/conflicts/'+id+'/reviewed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});load()}load();</script></body></html>
