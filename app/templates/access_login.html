<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | BrooksHouse</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f2ea;color:#201a18;font:17px system-ui,sans-serif}.card{width:min(430px,92vw);padding:28px;background:white;border:1px solid #e8ddd3;border-radius:20px;box-shadow:0 12px 35px #371f1718}h1{margin:0;color:#8f1f24}.brand{font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem}label{display:block;margin:16px 0 7px;font-weight:800}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;font:inherit}input{border:2px solid #cfbeb0}button{margin-top:18px;border:0;color:white;background:#8f1f24;font-weight:900;cursor:pointer}.error{padding:12px;border-radius:9px;color:#85131a;background:#fde9e9}.note{color:#6f6662;font-size:.9rem}</style></head>
<body><main class="card"><p class="brand">The BrooksHouse Store</p><h1>Team Sign In</h1><p>Sign in to open the tools allowed for your role.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/login"><label>Username</label><input name="username" autocomplete="username" required autofocus><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign In</button></form><p class="note">Cloudflare protects the public address. This login also protects direct and local access to BrooksHouse.</p></main></body></html>
