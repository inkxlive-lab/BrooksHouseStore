<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Inventory Search</title><link rel="stylesheet" href="/static/store.css">
<style>main{max-width:1150px;margin:22px auto;padding:14px}.card,.result{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-weight:800}input,select,button{width:100%;padding:11px;margin-top:5px}button{background:#9d252b;color:#fff;border:0;border-radius:8px;font-weight:800}.results{display:grid;gap:10px}.result h3{margin:0 0 6px}.description{overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.meta span{background:#f5f0e9;border-radius:7px;padding:7px;overflow-wrap:anywhere}.hint{display:block;margin-top:5px;color:#685d55;font-weight:400}@media(max-width:650px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}}</style>
</head><body><main><h1>Offline Inventory Search</h1><p>Search the most recently downloaded snapshot. Each filter works by itself.</p>
<form id="search-form" class="card"><div class="grid">
<label>Description / product<input name="search" placeholder="full or %plane%"></label>
<label>Barcode<input name="barcode" inputmode="numeric"></label>
<label>Location<select id="offline-location" name="location_id"><option value="">All locations</option></select></label>
<label>Pallet / Container ID<input name="container_id" placeholder="BR-TOTE-042 or %pick%"><small class="hint">Optional. When entered, container ID takes priority over description and quantity.</small></label>
<label>Minimum quantity<input name="minimum_quantity" type="number"></label>
<label>Maximum quantity<input name="maximum_quantity" type="number"></label>
</div><p><button>Search saved inventory</button></p></form>
<p id="summary"></p><div id="results" class="results"></div>
<p><a href="/inventory/search">Live Inventory Search</a> · <a href="/offline">Offline Center</a> · <a href="/dashboard">Dashboard</a></p>
</main><script src="/static/pwa.js?v=6.1"></script><script src="/static/offline-mode.js?v=6.1"></script><script>
const form=document.querySelector('#search-form'),locations=document.querySelector('#offline-location'),summary=document.querySelector('#summary'),results=document.querySelector('#results');
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function contains(value,query){return String(value||'').toUpperCase().includes(String(query||'').replace(/[%*]/g,'').toUpperCase())}
async function setup(){const s=await BrooksHouseOffline.snapshot();if(!s){summary.textContent='No snapshot saved. Open Offline Center and download one while connected.';return}const counts={};s.rows.forEach(r=>counts[String(r.location_id)]=(counts[String(r.location_id)]||0)+1);locations.innerHTML='<option value="">All locations ('+s.rows.length+')</option>';s.locations.forEach(l=>locations.appendChild(new Option(l.location_name+' ('+(counts[String(l.location_id)]||0)+')',String(l.location_id))));const containers=s.rows.filter(r=>String(r.container_id||'').trim()).length;summary.textContent='Offline search v6.1 - '+s.rows.length+' total records; '+containers+' container records.'}
form.addEventListener('submit',async e=>{e.preventDefault();const s=await BrooksHouseOffline.snapshot();if(!s)return;const f=Object.fromEntries(new FormData(form)),locationId=String(f.location_id||''),barcode=String(f.barcode||'').trim(),container=String(f.container_id||'').trim(),term=String(f.search||'').replace(/[%*]/g,'').trim(),minimum=String(f.minimum_quantity||'').trim(),maximum=String(f.maximum_quantity||'').trim();const rows=s.rows.filter(r=>{if(locationId&&String(r.location_id)!==locationId)return false;if(container)return contains(r.container_id,container);if(barcode&&!(r.barcodes||[]).some(b=>String(b).replace(/^0+/,'')===barcode.replace(/^0+/,'')))return false;if(term&&!contains([r.product_name,r.description,r.brand,r.category].join(' '),term))return false;if(minimum!==''&&Number(r.quantity)<Number(minimum))return false;if(maximum!==''&&Number(r.quantity)>Number(maximum))return false;return true});summary.textContent=rows.length+' matching inventory record(s) from saved snapshot.';results.innerHTML=rows.slice(0,250).map(r=>`<article class="result"><h3>${esc(r.product_name)}</h3><div class="description">${esc(r.description)}</div><div class="meta"><span><b>Barcode</b><br>${esc((r.barcodes||[])[0]||'')}</span><span><b>Location</b><br>${esc(r.location_name)}</span><span><b>Container</b><br>${esc(r.container_id||'None')}</span><span><b>Qty</b><br>${r.quantity}</span></div></article>`).join('')||'<article class="result">No saved records matched.</article>'});setup();
</script></body></html>
