<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#8f1f24">
    <title>BrooksHouse Offline</title>
    <style>
        body{margin:0;background:#f4ede5;color:#211d1b;font-family:Arial,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px}
        main{max-width:520px;background:white;border:1px solid #decfc2;border-radius:22px;padding:30px;text-align:center;box-shadow:0 12px 30px rgba(50,30,20,.09)}
        h1{color:#8f1f24}button{border:0;border-radius:10px;background:#8f1f24;color:white;padding:12px 18px;font-weight:800}
    </style>
</head>
<body><main><h1>BrooksHouse is offline</h1><p>The server or internet connection is temporarily unavailable. Scans and inventory changes require a live connection so nothing is saved incorrectly.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
